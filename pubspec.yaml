name: packright
description: AI-powered travel packing list app that generates personalized packing checklists from natural language trip descriptions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  share_plus: ^7.2.1
  uuid: ^4.2.1
  lottie: ^3.1.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1B7A6E"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#1B7A6E"
  color_dark: "#134D45"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
