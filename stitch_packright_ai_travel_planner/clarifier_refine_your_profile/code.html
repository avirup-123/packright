<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-background w-full z-50 sticky top-0 flex justify-between items-center px-margin-mobile py-base max-w-max-width mx-auto">
<div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">luggage</span>
<span class="font-headline-md text-headline-md font-bold text-primary">PackRight</span>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-xl">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop w-full max-w-max-width mx-auto pb-32 pt-md md:pt-lg">
<div class="max-w-2xl mx-auto w-full">
<!-- Header Text -->
<div class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">
                    Just a few quick details to perfect your list:
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    We'll tailor your packing recommendations based on these specifics.
                </p>
</div>
<!-- Interactive Interview Cards -->
<div class="space-y-md">
<!-- Card 1: Accommodation -->
<div class="bg-surface-container-low rounded-xl p-md shadow-ambient-low border border-surface-variant transition-all duration-300">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">
                        What type of accommodation are you staying in?
                    </h2>
<div class="flex flex-wrap gap-sm">
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Hotel / Airbnb</span>
</button>
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Backpacker Hostel</span>
</button>
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Camping / Outdoors</span>
</button>
</div>
</div>
<!-- Card 2: Activity Profile -->
<div class="bg-surface-container-low rounded-xl p-md shadow-ambient-low border border-surface-variant transition-all duration-300">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">
                        What is your primary activity profile?
                    </h2>
<div class="flex flex-wrap gap-sm">
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Business Meetings</span>
</button>
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Formal Wedding</span>
</button>
<button class="option-pill flex items-center gap-2 px-4 py-2 rounded-full border-2 pill-inactive transition-colors duration-200 hover:bg-surface-variant">
<span class="font-label-md text-label-md">Casual Sightseeing</span>
</button>
</div>
</div>
</div>
<!-- Action Area -->
<div class="mt-xl flex justify-center md:justify-end">
<button class="bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-full shadow-[0_4px_16px_rgba(107,94,81,0.1)] hover:shadow-none hover:bg-primary-container transition-all duration-200 flex items-center gap-2 active:scale-95 w-full md:w-auto justify-center">
<span class="">Build My Packing List</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<div class="fixed bottom-8 right-8 md:right-margin-desktop z-50 flex flex-col items-end gap-4">
  <button aria-label="Voice Input" class="w-14 h-14 flex items-center justify-center rounded-full bg-[#E06A4E] text-white shadow-lg hover:opacity-90 active:scale-95 transition-all group relative" id="voiceInputBtn">
    <span class="material-symbols-outlined text-[28px]">mic</span>
    <span class="absolute inset-0 rounded-full bg-[#E06A4E] animate-ping opacity-0 group-hover:opacity-20 transition-opacity"></span>
    <div class="absolute right-full mr-4 top-1/2 -translate-y-1/2 bg-inverse-surface text-inverse-on-surface px-3 py-1.5 rounded-lg text-sm font-label-md opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none shadow-md">
      Speak to refine list
    </div>
  </button>
</div></main>
<!-- BottomNavBar is suppressed due to Task-Focused intent (Clarifier screen before main app flow) -->
<script>
        // Simple logic to toggle pill states within groups
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.bg-surface-container-low');
            
            cards.forEach(card => {
                const pills = card.querySelectorAll('.option-pill');
                pills.forEach(pill => {
                    pill.addEventListener('click', () => {
                        // Deselect all in this card
                        pills.forEach(p => {
                            p.classList.remove('pill-active');
                            p.classList.add('pill-inactive');
                            // Remove checkmark if exists
                            const icon = p.querySelector('.material-symbols-outlined');
                            if(icon) icon.remove();
                        });
                        
                        // Select clicked
                        pill.classList.remove('pill-inactive');
                        pill.classList.add('pill-active');
                        
                        // Add checkmark
                        const checkIcon = document.createElement('span');
                        checkIcon.className = 'material-symbols-outlined text-sm';
                        checkIcon.textContent = 'check';
                        pill.insertBefore(checkIcon, pill.firstChild);
                    });
                });
            });
        });
    </script>


</body></html>
