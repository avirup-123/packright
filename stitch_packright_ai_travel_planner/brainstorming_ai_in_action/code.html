<!-- STITCH_THREEJS_START:ANIMATION_2 class="relative z-10 w-full h-full drop-shadow-md" -->
<div class="relative z-10 w-full h-full drop-shadow-md" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('animation-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Create a stylized suitcase/bag
const bodyGeom = new THREE.BoxGeometry(2, 1.5, 0.8);
const material = new THREE.MeshPhongMaterial({ color: 0xE06A4E }); // Terracotta
const body = new THREE.Mesh(bodyGeom, material);
scene.add(body);

const handleGeom = new THREE.TorusGeometry(0.3, 0.05, 16, 32, Math.PI);
const handle = new THREE.Mesh(handleGeom, material);
handle.position.y = 0.75;
scene.add(handle);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040, 2));

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    // Gentle floating and pulsing
    const time = Date.now() * 0.002;
    body.position.y = Math.sin(time) * 0.2;
    handle.position.y = 0.75 + Math.sin(time) * 0.2;
    
    body.rotation.y += 0.01;
    handle.rotation.y += 0.01;
    
    const scale = 1 + Math.sin(time) * 0.05;
    body.scale.set(scale, scale, scale);
    handle.scale.set(scale, scale, scale);
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();
})();
</script>

<!-- STITCH_THREEJS_END:ANIMATION_2 -->

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusMessages = [
                "Analyzing destination climate matrices...",
                "Calibrating baggage size boundaries...",
                "Assembling smart list rows..."
            ];
            
            const statusElement = document.getElementById('dynamic-status');
            let messageIndex = 0;

            // Cycle text every 1.5s
            const intervalId = setInterval(() => {
                // Fade out and move up slightly
                statusElement.style.opacity = '0';
                statusElement.style.transform = 'translateY(-10px)';
                
                setTimeout(() => {
                    // Update text, prep for fade in
                    messageIndex = (messageIndex + 1) % statusMessages.length;
                    statusElement.textContent = statusMessages[messageIndex];
                    
                    // Reset position below to slide up
                    statusElement.style.transform = 'translateY(10px)';
                    
                    // Force reflow
                    void statusElement.offsetWidth;
                    
                    // Fade in and settle
                    statusElement.style.opacity = '1';
                    statusElement.style.transform = 'translateY(0)';
                }, 300); // Wait for fade out to complete before swapping text
                
            }, 1500);

            // Auto-timeout after 3 seconds
            setTimeout(() => {
                clearInterval(intervalId);
                // Visual completion state before redirect
                statusElement.style.opacity = '0';
                setTimeout(() => {
                    statusElement.textContent = "Ready.";
                    statusElement.classList.add('text-primary', 'font-medium');
                    statusElement.style.opacity = '1';
                    statusElement.style.transform = 'translateY(0)';
                    
                    // Simulated navigation
                    console.log("[Navigation] Proceeding to Screen 3...");
                    // window.location.href = '#screen-3';
                }, 300);
            }, 3000);
        });
    </script>
<style>

            50% { transform: scaleX(0.6); }
            100% { transform: scaleX(1); }
